<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seoul Pop Fever</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            overflow: hidden;
            touch-action: manipulation;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .balloon {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .burst {
            animation: burst 0.4s forwards;
        }

        @keyframes burst {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.8), 0 0 20px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body class="text-white h-screen w-screen relative overflow-hidden">

    <!-- Header UI -->
    <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-20">
        <div class="glass p-4 rounded-2xl w-48">
            <h2 class="text-xs uppercase tracking-widest opacity-60">Seoul District</h2>
            <p id="districtName" class="text-2xl font-bold">Myeongdong</p>
        </div>
        <div class="glass p-4 rounded-2xl w-48 text-right">
            <h2 class="text-xs uppercase tracking-widest opacity-60">Pop Points</h2>
            <p id="points" class="text-3xl font-black neon-glow">0</p>
        </div>
    </div>

    <!-- Combo Display -->
    <div id="comboDisplay" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 hidden z-10 pointer-events-none">
        <h1 class="text-8xl font-black italic opacity-20">COMBO <span id="comboVal">0</span></h1>
    </div>

    <!-- Game Container -->
    <div id="gameCanvas" class="absolute inset-0 z-0"></div>

    <!-- Sidebar Upgrade Menu -->
    <div id="upgradePanel" class="absolute right-0 top-24 bottom-6 w-80 glass rounded-l-3xl p-6 transition-transform z-30 translate-x-full">
        <h2 class="text-xl font-bold mb-6 border-b border-white/10 pb-2">Upgrades</h2>
        <div class="space-y-4">
            <button onclick="buyUpgrade('freq')" class="w-full p-4 glass rounded-xl hover:bg-white/10 flex justify-between items-center transition">
                <span>Speed Boost</span>
                <span id="costFreq" class="text-purple-400">100 pts</span>
            </button>
            <button onclick="buyUpgrade('landmark')" class="w-full p-4 glass rounded-xl hover:bg-white/10 flex justify-between items-center transition">
                <span>Unlock Landmark</span>
                <span id="costLand" class="text-purple-400">500 pts</span>
            </button>
        </div>
        <button onclick="toggleMenu()" class="absolute -left-12 top-1/2 glass p-4 rounded-l-xl">⚙️</button>
    </div>

    <script>
        let points = 0;
        let combo = 0;
        let spawnRate = 1500;
        let lastClick = 0;
        const colors = ['#f87171', '#fbbf24', '#60a5fa', '#34d399', '#c084fc'];
        const landmarks = ['Myeongdong', 'N Seoul Tower', 'Gyeongbokgung', 'Dongdaemun'];
        let currentLandmark = 0;

        const pointsEl = document.getElementById('points');
        const comboEl = document.getElementById('comboDisplay');
        const comboVal = document.getElementById('comboVal');
        const gameCanvas = document.getElementById('gameCanvas');

        function updateUI() {
            pointsEl.innerText = Math.floor(points);
            document.getElementById('districtName').innerText = landmarks[currentLandmark];
        }

        function createBalloon() {
            const b = document.createElement('div');
            const size = Math.random() * 40 + 60;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            b.className = 'balloon absolute cursor-pointer rounded-full flex items-center justify-center';
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.background = color;
            b.style.boxShadow = `inset -10px -10px 20px rgba(0,0,0,0.2)`;
            b.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            b.style.top = window.innerHeight + 'px';
            
            b.onclick = () => popBalloon(b);
            gameCanvas.appendChild(b);

            // Animate rise
            const animation = b.animate([
                { transform: `translateY(0)` },
                { transform: `translateY(-${window.innerHeight + 100}px)` }
            ], { duration: 4000 });

            animation.onfinish = () => {
                if(b.parentElement) {
                    b.remove();
                    combo = 0;
                    comboEl.classList.add('hidden');
                }
            };
        }

        function popBalloon(el) {
            points += (1 + Math.floor(combo / 5));
            combo++;
            updateUI();
            
            if(combo > 1) {
                comboEl.classList.remove('hidden');
                comboVal.innerText = combo;
            }

            el.classList.add('burst');
            setTimeout(() => el.remove(), 400);
        }

        function buyUpgrade(type) {
            if(type === 'freq' && points >= 100) {
                points -= 100;
                spawnRate = Math.max(300, spawnRate - 200);
            } else if(type === 'landmark' && points >= 500) {
                points -= 500;
                currentLandmark = (currentLandmark + 1) % landmarks.length;
            }
            updateUI();
        }

        function toggleMenu() {
            const menu = document.getElementById('upgradePanel');
            menu.style.transform = menu.style.transform === 'translateX(0px)' ? 'translateX(100%)' : 'translateX(0px)';
        }

        setInterval(createBalloon, spawnRate);
    </script>
</body>
</html>
